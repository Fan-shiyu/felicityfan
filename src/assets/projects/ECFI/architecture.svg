<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 650" width="1920" height="650"><rect x="0" y="0" width="1920" height="650" fill="#FFFFFF"/><defs>
<marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
<polygon points="0 0, 10 4, 0 8" fill="#333333"/>
</marker>
</defs><text x="40" y="46" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#1A1A1A">ECFI Community Foundation Workflow: Plugin Architecture</text><text x="40" y="72" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-style="italic" fill="#666666">Replacing manual, email based data collection with a self service review and publishing system</text><rect x="40" y="108" width="320" height="470" rx="18" ry="18" fill="#E8F2FC" stroke="#5B9BD5" stroke-width="2"/><g transform="translate(58,124)"><rect x="0" y="10" width="22" height="16" rx="3" fill="none" stroke="#2B5F8C" stroke-width="2"/>
    <path d="M 4 10 L 4 6 A 7 7 0 0 1 18 6 L 18 10" fill="none" stroke="#2B5F8C" stroke-width="2"/>
    <circle cx="11" cy="18" r="2" fill="#2B5F8C"/></g><text x="96" y="141" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2B5F8C">Collaborator Access</text><rect x="56" y="160" width="288" height="185" rx="12" ry="12" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="1.6"/><text x="74" y="192" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Secure Personal Access</text><text x="74" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">One token link per collaborator.</text><text x="74" y="235" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">No account or login required.</text><rect x="56" y="363" width="288" height="195" rx="12" ry="12" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="1.6"/><text x="74" y="395" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Review Interface</text><text x="74" y="419" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">Table View to review many foundations</text><text x="74" y="438" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">at once, or Full Form for detailed,</text><text x="74" y="457" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">single record editing.</text><rect x="400" y="108" width="320" height="470" rx="18" ry="18" fill="#F1EAFB" stroke="#9B7EDE" stroke-width="2"/><g transform="translate(418,124)"><circle cx="11" cy="11" r="11" fill="none" stroke="#6B3FA0" stroke-width="2"/>
    <path d="M 5.5 11 L 9.5 15 L 17 6.5" fill="none" stroke="#6B3FA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="456" y="141" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#6B3FA0">Automated Review and Merge</text><rect x="416" y="160" width="288" height="185" rx="12" ry="12" fill="#FFFFFF" stroke="#9B7EDE" stroke-width="1.6"/><text x="434" y="192" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Submit and Queue</text><text x="434" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">One row, or every change at once,</text><text x="434" y="235" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">lands in a single review queue.</text><rect x="416" y="363" width="288" height="195" rx="12" ry="12" fill="#FFFFFF" stroke="#9B7EDE" stroke-width="1.6"/><text x="434" y="395" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">One Click Approval</text><text x="434" y="419" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">The admin approves once and the</text><text x="434" y="438" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">change writes straight into the</text><text x="434" y="457" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">live database.</text><rect x="568.9" y="526" width="121.1" height="21" rx="10.5" ry="10.5" fill="#F1EAFB" stroke="#9B7EDE" stroke-width="1.2"/><text x="629.4499999999999" y="540.5" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.8" font-weight="700" fill="#6B3FA0" text-anchor="middle">no manual merging</text><path d="M 782 330.4 A 115.0 30.400000000000002 0 0 1 1012 330.4 L 1012 459.6 A 115.0 30.400000000000002 0 0 1 782 459.6 Z" fill="#FEF6D9" stroke="#D9B94A" stroke-width="2"/><ellipse cx="897.0" cy="330.4" rx="115.0" ry="30.400000000000002" fill="#FEF6D9" stroke="#D9B94A" stroke-width="2"/><text x="897.0" y="397.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#1A1A1A" text-anchor="middle">Live WordPress Database</text><text x="897.0" y="417.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.8" fill="#666666" text-anchor="middle">945+ community foundations</text><text x="897.0" y="434.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.8" fill="#666666" text-anchor="middle">single source of truth</text><rect x="760" y="108" width="275" height="172" rx="18" ry="18" fill="#E8F8F0" stroke="#52B788" stroke-width="2"/><g transform="translate(778,124)"><rect x="0" y="0" width="22" height="22" rx="5" fill="none" stroke="#2E7D53" stroke-width="2"/>
    <path d="M 11 5 L 11 17 M 5 11 L 17 11" stroke="#2E7D53" stroke-width="2.2" stroke-linecap="round"/></g><text x="816" y="141" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2E7D53">Self Extending Data Model</text><rect x="776" y="160" width="243" height="100" rx="12" ry="12" fill="#FFFFFF" stroke="#52B788" stroke-width="1.6"/><text x="794" y="192" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Custom Fields</text><text x="794" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">Admin adds new data columns</text><text x="794" y="235" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">anytime, no developer needed.</text><rect x="1082" y="108" width="320" height="300" rx="18" ry="18" fill="#FDF0E4" stroke="#E0975A" stroke-width="2"/><g transform="translate(1100,124)"><rect x="0" y="3" width="22" height="16" rx="3" fill="none" stroke="#B5622A" stroke-width="2"/>
    <path d="M 1 5 L 11 13 L 21 5" fill="none" stroke="#B5622A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1138" y="141" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#B5622A">Automated Communication</text><rect x="1098" y="160" width="288" height="105" rx="12" ry="12" fill="#FFFFFF" stroke="#E0975A" stroke-width="1.6"/><text x="1116" y="192" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Smart Invitations</text><text x="1116" y="216" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">Personalized links, sent</text><text x="1116" y="235" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">individually or in bulk.</text><rect x="1098" y="275" width="288" height="113" rx="12" ry="12" fill="#FFFFFF" stroke="#E0975A" stroke-width="1.6"/><text x="1116" y="307" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">Automatic Notifications</text><text x="1116" y="331" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">Collaborators get confirmations,</text><text x="1116" y="350" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">admin gets alerted on submission.</text><rect x="1082" y="438" width="320" height="165" rx="18" ry="18" fill="#FEF6D9" stroke="#D9B94A" stroke-width="2"/><g transform="translate(1100,454)"><path d="M 11 1 L 11 14 M 5 9 L 11 15 L 17 9" fill="none" stroke="#8A7112" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 2 18 L 2 20 A 2 2 0 0 0 4 22 L 18 22 A 2 2 0 0 0 20 20 L 20 18" fill="none" stroke="#8A7112" stroke-width="2.2" stroke-linecap="round"/></g><text x="1138" y="471" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#8A7112">One Click Reporting</text><rect x="1098" y="490" width="288" height="98" rx="12" ry="12" fill="#FFFFFF" stroke="#D9B94A" stroke-width="1.6"/><text x="1116" y="522" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16.5" font-weight="700" fill="#1A1A1A">On Demand Exports</text><text x="1116" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">Full database snapshot, or a</text><text x="1116" y="565" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" fill="#555555">ready to use mail merge list.</text><rect x="1470" y="300" width="300" height="190" rx="14" ry="14" fill="#16233A" stroke="#16233A" stroke-width="2"/><text x="1620.0" y="338" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Collaborators and Website Admin</text><text x="1620.0" y="364" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D3E0" text-anchor="middle">The two roles this system</text><text x="1620.0" y="382" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#C9D3E0" text-anchor="middle">is actually built to save time for</text><path d="M 360 343 L 400 343" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 720 460 Q 810 460 782 395" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 897.5 280 L 897.0 300" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 1012 360 Q 1102 258 1082 258" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 1012 440 Q 1102 512 1082 512" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 1402 258 Q 1380 258 1470 370" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 1402 512 Q 1380 528 1470 450" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrowhead)"/><text x="40" y="628" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-style="italic" fill="#888888">Every automated step above replaces a task that previously had to be done by hand: merging spreadsheets, copying links, and re-uploading files.</text></svg>